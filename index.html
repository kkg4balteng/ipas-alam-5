<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPI IPAS Kelas 5 - Geografi Indonesia</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap');
        
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f0fdf4;
            overflow: hidden; /* Prevent scrolling on IFP */
            user-select: none; /* Prevent accidental text selection on touch */
        }
        
        h1, h2, h3, h4, h5, .title-font {
            font-family: 'Fredoka', sans-serif;
        }

        .bg-global {
            /* Menggunakan direct link dari freeimage.host (iili.io) agar bisa dimuat sebagai background CSS */
            background-image: url('https://iili.io/BYUlwJa.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: #dcfce7; /* Fallback */
        }

        .card-shadow {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05), 0 8px 0px 0px rgba(21, 128, 61, 1);
        }
        
        .card-shadow:active {
            transform: translateY(4px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06), 0 4px 0px 0px rgba(21, 128, 61, 1);
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        /* Hover animation for menu cards */
        .menu-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .menu-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.1);
        }

        /* Scrollbar styling for content areas */
        .custom-scroll::-webkit-scrollbar {
            width: 12px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: #e5e7eb;
            border-radius: 8px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background-color: #22c55e;
            border-radius: 8px;
            border: 3px solid #e5e7eb;
        }

        /* Drag and Drop styles */
        .draggable-item {
            touch-action: none; /* Prevent default touch actions like scrolling when dragging */
        }
        .dragging {
            opacity: 0.8;
            transform: scale(1.05);
            z-index: 50;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- DATA CONTENT ---
        const gameData = {
            level1: {
                title: "Letak Wilayah Indonesia",
                challenges: [
                    { id: 'l1c1', diff: 'Mudah', type: 'mcq', q: "Indonesia diapit oleh dua samudra besar, yaitu...", options: ["Hindia dan Atlantik", "Hindia dan Pasifik", "Pasifik dan Arktik", "Atlantik dan Pasifik"], ans: 1 },
                    { id: 'l1c2', diff: 'Sedang', type: 'mcq', q: "Secara geografis, Indonesia terletak di antara Benua Asia dan Benua...", options: ["Eropa", "Afrika", "Amerika", "Australia"], ans: 3 },
                    { id: 'l1c3', diff: 'Sulit', type: 'mcq', q: "Garis khayal yang membagi bumi menjadi belahan utara dan selatan yang melewati Indonesia disebut...", options: ["Garis Bujur", "Garis Lintang", "Garis Khatulistiwa", "Garis Meridian"], ans: 2 }
                ]
            },
            level2: {
                title: "Kenampakan Alam & Iklim",
                challenges: [
                    { id: 'l2c1', diff: 'Mudah', type: 'mcq', q: "Kenampakan alam berupa daratan yang sangat tinggi menjulang disebut...", options: ["Pantai", "Dataran Rendah", "Pegunungan", "Selat"], ans: 2 },
                    { id: 'l2c2', diff: 'Sedang', type: 'mcq', q: "Karena terletak di garis khatulistiwa, Indonesia memiliki iklim...", options: ["Subtropis", "Tropis", "Sedang", "Dingin"], ans: 1 },
                    // NEW: Drag and Drop Challenge
                    { 
                        id: 'l2c3', 
                        diff: 'Sulit', 
                        type: 'dnd', 
                        title: "Cocokkan Flora & Fauna!",
                        q: "Tarik (Drag) nama hewan/tumbuhan ke keranjang wilayah persebaran yang tepat!",
                        items: [
                            { id: 'i1', name: 'Harimau Sumatra', type: 'Asiatis', icon: 'cat' },
                            { id: 'i2', name: 'Komodo', type: 'Peralihan', icon: 'bug' },
                            { id: 'i3', name: 'Burung Cenderawasih', type: 'Australis', icon: 'bird' },
                            { id: 'i4', name: 'Bunga Rafflesia', type: 'Asiatis', icon: 'flower-2' },
                            { id: 'i5', name: 'Pohon Sagu', type: 'Australis', icon: 'tree-palm' }
                        ],
                        zones: [
                            { id: 'Asiatis', label: 'Tipe Asiatis', color: 'yellow' },
                            { id: 'Peralihan', label: 'Tipe Peralihan', color: 'orange' },
                            { id: 'Australis', label: 'Tipe Australis', color: 'red' }
                        ]
                    }
                ]
            },
            level3: {
                title: "Pengaruh Geografis",
                challenges: [
                    { id: 'l3c1', diff: 'Mudah', type: 'mcq', q: "Mayoritas mata pencaharian penduduk yang tinggal di daerah pesisir pantai adalah...", options: ["Petani teh", "Pekerja kantoran", "Nelayan", "Penambang emas"], ans: 2 },
                    { id: 'l3c2', diff: 'Sedang', type: 'mcq', q: "Keuntungan letak geografis Indonesia di persimpangan lalu lintas dunia adalah...", options: ["Sering terjadi bencana alam gempa bumi", "Menjadi jalur perdagangan internasional yang ramai", "Memiliki banyak gunung berapi aktif", "Suhu udara menjadi lebih panas"], ans: 1 },
                    { id: 'l3c3', diff: 'Sulit', type: 'mcq', q: "Tantangan pembangunan antar wilayah di Indonesia sering tidak merata. Hal ini utamanya disebabkan oleh...", options: ["Kondisi geografis kepulauan yang menyulitkan transportasi dan akses", "Jumlah penduduk yang terlalu sedikit di setiap pulau", "Kurangnya sumber daya alam di Indonesia", "Semua masyarakat ingin tinggal di perkotaan"], ans: 0 }
                ]
            }
        };

        // --- COMPONENTS ---

        // 1. Icons Component (SVG wrappers)
        const Icon = ({ name, size = 24, className = "" }) => {
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        // 2. Drag and Drop Mini Game Component
        const DragAndDropGame = ({ data, onComplete }) => {
            const [items, setItems] = useState(data.items.map(item => ({ ...item, zone: null })));
            const [draggedItemId, setDraggedItemId] = useState(null);
            
            // For touch interaction tracking
            const dragNode = useRef(null);
            const dropZonesRef = useRef({});

            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [items]);

            // --- Mouse Events ---
            const handleDragStart = (e, id) => {
                setDraggedItemId(id);
                // Required for Firefox
                e.dataTransfer.setData('text/plain', id);
                e.dataTransfer.effectAllowed = 'move';
            };

            const handleDragOver = (e) => {
                e.preventDefault(); // Necessary to allow dropping
                e.dataTransfer.dropEffect = 'move';
            };

            const handleDrop = (e, zoneId) => {
                e.preventDefault();
                const itemId = e.dataTransfer.getData('text/plain') || draggedItemId;
                if (itemId) {
                    processDrop(itemId, zoneId);
                }
            };

            // --- Touch Events for Interactive Flat Panel ---
            const handleTouchStart = (e, id) => {
                setDraggedItemId(id);
                dragNode.current = e.target.closest('.draggable-item');
                // Optional: add visual feedback immediately
            };

            const handleTouchMove = (e) => {
                if (!draggedItemId || !dragNode.current) return;
                // Prevent default scrolling while dragging
                e.preventDefault();
                
                // Visual movement of the dragged item (optional, basic implementation)
                const touch = e.touches[0];
                dragNode.current.style.position = 'fixed';
                dragNode.current.style.left = `${touch.clientX - dragNode.current.offsetWidth / 2}px`;
                dragNode.current.style.top = `${touch.clientY - dragNode.current.offsetHeight / 2}px`;
                dragNode.current.style.zIndex = '1000';
            };

            const handleTouchEnd = (e) => {
                if (!draggedItemId || !dragNode.current) return;
                
                const touch = e.changedTouches[0];
                
                // Reset styling
                dragNode.current.style.position = '';
                dragNode.current.style.left = '';
                dragNode.current.style.top = '';
                dragNode.current.style.zIndex = '';

                // Find if touch ended over a drop zone
                let droppedZoneId = null;
                for (const zoneId in dropZonesRef.current) {
                    const zoneElement = dropZonesRef.current[zoneId];
                    if (zoneElement) {
                        const rect = zoneElement.getBoundingClientRect();
                        if (
                            touch.clientX >= rect.left &&
                            touch.clientX <= rect.right &&
                            touch.clientY >= rect.top &&
                            touch.clientY <= rect.bottom
                        ) {
                            droppedZoneId = zoneId;
                            break;
                        }
                    }
                }

                if (droppedZoneId) {
                    processDrop(draggedItemId, droppedZoneId);
                }
                
                setDraggedItemId(null);
                dragNode.current = null;
            };

            // --- Core Logic ---
            const processDrop = (itemId, zoneId) => {
                setItems(prevItems => 
                    prevItems.map(item => {
                        if (item.id === itemId) {
                            return { ...item, zone: zoneId };
                        }
                        return item;
                    })
                );
                setDraggedItemId(null);
            };

            const handleReturnToPool = (itemId) => {
                 setItems(prevItems => 
                    prevItems.map(item => {
                        if (item.id === itemId) {
                            return { ...item, zone: null };
                        }
                        return item;
                    })
                );
            };

            const checkAnswers = () => {
                const allPlaced = items.every(item => item.zone !== null);
                if (!allPlaced) {
                    alert("Tolong letakkan semua gambar ke dalam keranjang terlebih dahulu!");
                    return;
                }

                const isAllCorrect = items.every(item => item.type === item.zone);
                onComplete(isAllCorrect);
            };

            return (
                <div className="w-full flex flex-col items-center gap-8">
                    <div className="bg-white/90 p-6 rounded-2xl shadow-md border-2 border-orange-200 text-center w-full">
                        <h2 className="text-3xl font-bold title-font text-orange-600 mb-2">{data.title}</h2>
                        <p className="text-xl text-gray-700">{data.q}</p>
                    </div>

                    {/* Source Pool */}
                    <div className="bg-white/50 p-6 rounded-2xl w-full min-h-[120px] flex flex-wrap justify-center gap-4 border-dashed border-4 border-gray-300">
                        {items.filter(item => item.zone === null).map(item => (
                            <div 
                                key={item.id}
                                draggable="true"
                                onDragStart={(e) => handleDragStart(e, item.id)}
                                onDragEnd={() => setDraggedItemId(null)}
                                onTouchStart={(e) => handleTouchStart(e, item.id)}
                                onTouchMove={handleTouchMove}
                                onTouchEnd={handleTouchEnd}
                                className={`draggable-item bg-white px-6 py-4 rounded-xl card-shadow border-2 border-gray-200 cursor-grab active:cursor-grabbing flex items-center gap-3 select-none
                                    ${draggedItemId === item.id ? 'dragging opacity-50' : ''}`}
                            >
                                <div className="bg-gray-100 p-2 rounded-full"><Icon name={item.icon} size={28} className="text-gray-600"/></div>
                                <span className="text-xl font-bold">{item.name}</span>
                            </div>
                        ))}
                        {items.filter(item => item.zone === null).length === 0 && (
                            <div className="text-gray-400 font-bold text-xl flex items-center h-full">Semua item telah dipindahkan!</div>
                        )}
                    </div>

                    {/* Drop Zones */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6 w-full">
                        {data.zones.map(zone => {
                            const zoneItems = items.filter(item => item.zone === zone.id);
                            
                            // Determine color classes
                            let bgColor = 'bg-gray-100';
                            let borderColor = 'border-gray-300';
                            let headerColor = 'bg-gray-200 text-gray-700';
                            
                            if (zone.color === 'yellow') { bgColor='bg-yellow-50'; borderColor='border-yellow-300'; headerColor='bg-yellow-200 text-yellow-800'; }
                            if (zone.color === 'orange') { bgColor='bg-orange-50'; borderColor='border-orange-300'; headerColor='bg-orange-200 text-orange-800'; }
                            if (zone.color === 'red') { bgColor='bg-red-50'; borderColor='border-red-300'; headerColor='bg-red-200 text-red-800'; }

                            return (
                                <div 
                                    key={zone.id}
                                    ref={el => dropZonesRef.current[zone.id] = el}
                                    onDragOver={handleDragOver}
                                    onDrop={(e) => handleDrop(e, zone.id)}
                                    className={`${bgColor} border-4 border-dashed ${borderColor} rounded-2xl overflow-hidden min-h-[250px] flex flex-col transition-colors ${draggedItemId ? 'bg-green-50 border-green-400' : ''}`}
                                >
                                    <div className={`${headerColor} p-4 text-center font-bold text-2xl title-font`}>
                                        {zone.label}
                                    </div>
                                    <div className="p-4 flex-1 flex flex-col gap-3 relative">
                                        {zoneItems.length === 0 && <div className="absolute inset-0 flex items-center justify-center text-gray-400 font-bold opacity-50">Tarik ke sini</div>}
                                        {zoneItems.map(item => (
                                            <div 
                                                key={item.id}
                                                onClick={() => handleReturnToPool(item.id)}
                                                className="bg-white px-4 py-3 rounded-xl shadow-sm border border-gray-200 flex items-center gap-3 cursor-pointer hover:bg-red-50 hover:border-red-200 group"
                                                title="Ketuk untuk mengembalikan"
                                            >
                                                <div className="bg-gray-100 p-1 rounded-full"><Icon name={item.icon} size={20} className="text-gray-600"/></div>
                                                <span className="font-bold text-lg flex-1">{item.name}</span>
                                                <Icon name="x" size={20} className="text-red-400 opacity-0 group-hover:opacity-100 transition-opacity" />
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            );
                        })}
                    </div>

                    <button 
                        onClick={checkAnswers}
                        className="mt-4 bg-green-500 hover:bg-green-600 text-white px-10 py-4 rounded-2xl text-2xl font-bold card-shadow"
                    >
                        PERIKSA JAWABAN
                    </button>
                </div>
            );
        };

        // 3. Main App Component
        const App = () => {
            const [screen, setScreen] = useState('home'); // home, menu, tujuan, materi, game, asesmen, hots
            const [userData, setUserData] = useState({ name: '', school: '' });
            const [isFullscreen, setIsFullscreen] = useState(false);
            
            // Progress: { level1: 0-3, level2: 0-3, level3: 0-3 }
            const [progress, setProgress] = useState({ level1: 0, level2: 0, level3: 0 });

            // State for sub-screens moved to top level to prevent React Hook errors
            const [activeTab, setActiveTab] = useState(1);
            const [activeChallenge, setActiveChallenge] = useState(null); // null means map view
            const [feedback, setFeedback] = useState(null); // { isCorrect: boolean, msg: string }

            useEffect(() => {
                // Initialize Lucide icons
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [screen, progress, activeTab, activeChallenge, feedback]);

            const toggleFullscreen = () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(err => {
                        console.log(`Error attempting to enable fullscreen: ${err.message}`);
                    });
                    setIsFullscreen(true);
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                        setIsFullscreen(false);
                    }
                }
            };

            const playClickSound = () => {
                // Placeholder for sound effect (if needed in future)
            };

            const navigate = (newScreen) => {
                playClickSound();
                setScreen(newScreen);
                if (newScreen !== 'game') {
                    setActiveChallenge(null);
                    setFeedback(null);
                }
            };

            // --- Sub-Screens Renderers ---

            const renderHome = () => (
                <div className="flex flex-col items-center justify-center h-screen bg-global relative w-full">
                    <button onClick={toggleFullscreen} className="absolute top-4 right-4 bg-gray-800 text-white p-3 rounded-full hover:bg-gray-700">
                        <Icon name={isFullscreen ? "minimize" : "maximize"} size={28} />
                    </button>
                    
                    <div className="glass-panel p-8 rounded-3xl shadow-2xl max-w-4xl w-full text-center flex flex-col md:flex-row items-center gap-8">
                        <div className="w-1/3 flex flex-col items-center">
                            <div className="w-48 h-48 bg-white rounded-full border-8 border-green-500 overflow-hidden mb-4 flex items-center justify-center relative shadow-inner">
                                {/* Custom Image Avatar Pak Rahmat */}
                                <img 
                                    src="https://iili.io/BYUEGWl.png" 
                                    alt="Pak Rahmat" 
                                    className="w-full h-full object-cover" 
                                    onError={(e) => { e.target.onerror = null; e.target.src="https://iili.io/BYUEGWl.jpg"; }}
                                />
                            </div>
                            <div className="bg-yellow-400 text-yellow-900 font-bold px-4 py-2 rounded-full title-font text-xl border-4 border-white shadow-lg -mt-8 relative z-10">
                                Pak Rahmat
                            </div>
                        </div>
                        
                        <div className="w-2/3 text-left">
                            <h1 className="text-4xl font-extrabold text-green-700 mb-4 title-font tracking-wide">
                                Halo, Petualang Cilik! 🌍
                            </h1>
                            <p className="text-xl text-gray-700 mb-6 font-medium leading-relaxed">
                                Selamat datang di MPI IPAS. Hari ini kita akan menjelajahi keindahan, letak geografis, dan kekayaan alam Indonesia. Sudah siap berpetualang dan belajar bersama Bapak?
                            </p>
                            
                            <div className="space-y-4 mb-8">
                                <input 
                                    type="text" 
                                    placeholder="Masukkan Nama Lengkapmu..." 
                                    className="w-full text-xl p-4 border-4 border-green-300 rounded-2xl focus:outline-none focus:border-green-600 focus:ring-4 focus:ring-green-200 transition"
                                    value={userData.name}
                                    onChange={(e) => setUserData({...userData, name: e.target.value})}
                                />
                                <input 
                                    type="text" 
                                    placeholder="Asal Sekolah..." 
                                    className="w-full text-xl p-4 border-4 border-green-300 rounded-2xl focus:outline-none focus:border-green-600 focus:ring-4 focus:ring-green-200 transition"
                                    value={userData.school}
                                    onChange={(e) => setUserData({...userData, school: e.target.value})}
                                />
                            </div>
                            
                            <button 
                                onClick={() => navigate('menu')}
                                disabled={!userData.name || !userData.school}
                                className={`w-full py-4 rounded-2xl title-font text-2xl text-white transition-all transform card-shadow ${(!userData.name || !userData.school) ? 'bg-gray-400 cursor-not-allowed' : 'bg-green-500 hover:bg-green-600 active:scale-95'}`}
                            >
                                MULAI PETUALANGAN!
                            </button>
                        </div>
                    </div>
                </div>
            );

            const renderMenu = () => (
                <div className="flex flex-col h-screen bg-global w-full">
                    <header className="bg-green-800/90 backdrop-blur-md text-white p-6 shadow-lg flex justify-between items-center z-20 border-b border-green-600">
                        <div className="flex items-center gap-4">
                            <div className="bg-white/20 p-3 rounded-full">
                                <Icon name="compass" size={32} />
                            </div>
                            <div>
                                <h1 className="text-3xl font-extrabold title-font tracking-wide drop-shadow-md">Menu Navigasi Utama</h1>
                                <p className="text-lg font-medium opacity-90">Petualang Aktif: <span className="font-bold text-yellow-300">{userData.name}</span></p>
                            </div>
                        </div>
                        <button onClick={() => navigate('home')} className="bg-red-500 hover:bg-red-600 px-6 py-3 rounded-2xl font-bold flex items-center gap-2 text-xl transition-colors shadow-md border-b-4 border-red-700 active:border-b-0 active:translate-y-1">
                            <Icon name="log-out" /> Keluar
                        </button>
                    </header>
                    
                    <div className="flex-1 p-8 flex items-center justify-center relative overflow-y-auto custom-scroll">
                        {/* Semi-transparent overlay to make cards pop more against complex background */}
                        <div className="absolute inset-0 bg-black/10 pointer-events-none"></div>
                        
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 max-w-6xl w-full relative z-10 p-4">
                            
                            <button onClick={() => navigate('tujuan')} className="menu-card bg-gradient-to-br from-blue-400 to-blue-600 text-white p-8 rounded-[2rem] flex flex-col items-center justify-center gap-6 border-4 border-white/30 shadow-xl group">
                                <div className="bg-white/20 p-6 rounded-full group-hover:scale-110 group-hover:rotate-6 transition-transform duration-300 shadow-inner">
                                    <Icon name="target" size={72} />
                                </div>
                                <div className="text-center">
                                    <h2 className="text-3xl font-bold title-font mb-2 drop-shadow-md">Tujuan & Panduan</h2>
                                    <p className="text-blue-100 font-medium">Langkah Awal Petualangan</p>
                                </div>
                            </button>

                            <button onClick={() => navigate('materi')} className="menu-card bg-gradient-to-br from-purple-400 to-purple-600 text-white p-8 rounded-[2rem] flex flex-col items-center justify-center gap-6 border-4 border-white/30 shadow-xl group">
                                <div className="bg-white/20 p-6 rounded-full group-hover:scale-110 group-hover:-rotate-6 transition-transform duration-300 shadow-inner">
                                    <Icon name="book-open" size={72} />
                                </div>
                                <div className="text-center">
                                    <h2 className="text-3xl font-bold title-font mb-2 drop-shadow-md">Rangkuman Materi</h2>
                                    <p className="text-purple-100 font-medium">Bekal Pengetahuan</p>
                                </div>
                            </button>

                            <button onClick={() => navigate('game')} className="menu-card bg-gradient-to-br from-orange-400 to-orange-600 text-white p-8 rounded-[2rem] flex flex-col items-center justify-center gap-6 border-4 border-white/30 shadow-xl group lg:row-span-2">
                                <div className="bg-white/20 p-8 rounded-full group-hover:scale-110 group-hover:rotate-12 transition-transform duration-300 shadow-inner relative">
                                    {/* Pulse effect indicator */}
                                    <div className="absolute inset-0 rounded-full border-4 border-white animate-ping opacity-20"></div>
                                    <Icon name="map" size={88} />
                                </div>
                                <div className="text-center">
                                    <h2 className="text-4xl font-extrabold title-font mb-3 drop-shadow-md">Ayo Berpetualang!</h2>
                                    <p className="text-orange-100 text-xl font-medium">Uji Pengetahuanmu di Sini</p>
                                    <div className="mt-6 bg-white/20 px-4 py-2 rounded-full inline-block font-bold">
                                        Progres: {progress.level1 + progress.level2 + progress.level3}/9
                                    </div>

                                </div>

                                <div className="space-y-6">

                                    </div>
                                    
                                    <div className="bg-red-50 p-6 rounded-xl border border-red-100">

                    {screen === 'game' && renderGame()}
                    {screen === 'asesmen' && renderAsesmen()}

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
